<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>LocustKing</title>
<meta name="description" content="Lead a swarm of locusts to pillage a pixelated countryside.">
<style>
  :root { --bg: #14110a; --fg: #f4e9c1; --accent: #f6c600; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg);
    font-family: system-ui, sans-serif; overflow: hidden; }
  #stage { position: relative; width: 100vw; height: 100vh; display: flex;
    align-items: center; justify-content: center; }
  #wrap { position: relative; aspect-ratio: 4 / 3; width: min(100vw, calc(100vh * 4 / 3)); }
  canvas { width: 100%; height: 100%; display: block; background: #000; touch-action: none; cursor: crosshair; }
  #overlay { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center;
    justify-content: center; text-align: center; gap: 12px; padding: 16px; background: rgba(20,17,10,.85); }
  #overlay.hidden { display: none; }
  h1 { margin: 0; font-size: clamp(28px, 6vw, 56px); color: var(--accent); }
  p { margin: 0; max-width: 34em; line-height: 1.4; font-size: clamp(13px, 2vw, 17px); }
  button { font: inherit; font-weight: 700; padding: 10px 28px; border: 0; border-radius: 6px;
    background: var(--accent); color: #2a2100; cursor: pointer; }
  button:disabled { opacity: .5; cursor: default; }
  small { opacity: .7; }
</style>
</head>
<body>
<div id="stage">
  <div id="wrap">
    <canvas id="game" width="1024" height="768"></canvas>
    <div id="overlay">
      <h1>LocustKing</h1>
      <p>You are the Locust King. Move your mouse (or finger) to fly; your swarm follows. Drain the green tiles
         until the whole map is dead, but don't linger on dead tiles or mountains &mdash; your followers will perish.</p>
      <button id="start" disabled>Loading&hellip;</button>
      <small>Press <b>M</b> to toggle music &middot; <a style="color:inherit" href="https://github.com/EthanLebowitz/LocustKing">source</a></small>
    </div>
  </div>
</div>
<script src="web/tracks.js"></script>
<script src="web/game.js"></script>
</body>
</html>
